# Package gandal-sdk : client Python pour la plateforme GANDAL.
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gandal-sdk"
version = "0.5.0"
description = "SDK Python pour les apps externes de la plateforme GANDAL"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Zenbx" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

# LA COMMANDE « gandal-ssh ». Elle n est pas un confort : entrer dans une VM
# est le geste le plus frequent, et obliger a ecrire une ligne de Python pour
# demander un certificat ferait que personne ne le ferait — et que les cles
# permanentes resteraient.
[project.scripts]
gandal-ssh = "gandal_sdk.acces_ssh:cli"

[tool.setuptools.package-data]
gandal_sdk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: necessite une instance d'iaas-api (GANDAL_IT_ENDPOINT)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
