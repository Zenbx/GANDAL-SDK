name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  # Le SDK contre une vraie iaas-api (branche main), sur une base neuve.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GANDAL-BACKEND-IaaS/iaas-api
          path: iaas-api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" -r iaas-api/requirements.txt
      - run: scripts/run_integration.sh iaas-api python

  # Le wheel construit, installe seul dans un environnement vierge, passe les tests :
  # aucun module ni fichier oublie a l'empaquetage.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl pytest pytest-asyncio respx
          /tmp/wheelenv/bin/python -m pytest -q -p no:cacheprovider -o pythonpath=
          /tmp/wheelenv/bin/python -c "import gandal_sdk, sys; assert 'site-packages' in gandal_sdk.__file__, gandal_sdk.__file__"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # L'instantane openapi/iaas-api.json est-il encore celui de la branche main d'iaas-api ?
  # Un echec signale que l'API a change : relancer sync_openapi.py et ajuster le SDK.
  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GANDAL-BACKEND-IaaS/iaas-api
          path: iaas-api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx -r iaas-api/requirements.txt
      - run: python scripts/sync_openapi.py --app-dir iaas-api
      - run: git diff --exit-code openapi/
